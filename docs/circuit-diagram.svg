<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>Nano 33 IoT PIR, INA219 and low-voltage relay circuit</title><desc>External fused 5 V supplies a lamp through INA219 shunt and relay NO, and separately the relay coil and PIR. USB powers Nano separately. All grounds common. D2 reads PIR, D5 drives active-high relay IN with 10 kilohm pulldown. A4/A5 connect INA219 I2C at 3.3 V.</desc><rect width="1200" height="800" fill="white"/><g font-family="sans-serif" font-size="17" fill="#162d3a"><text x="25" y="30">External 5 V ≥1 A; Nano USB is separate. All logic ≤3.3 V. No mains or critical loads.</text><rect x="25" y="70" width="160" height="110" fill="#fcebdc" stroke="#162d3a"/><text x="40" y="100">5 V supply</text><text x="40" y="130">+ → 1 A fuse</text><text x="40" y="165">− common GND</text><rect x="325" y="75" width="260" height="160" fill="#e3f1f9" stroke="#162d3a"/><text x="350" y="100">INA219 0x40</text><text x="430" y="115" font-size="13">shunt</text><text x="330" y="140">VIN+</text><text x="525" y="140">VIN−</text><text x="335" y="200">VCC</text><text x="400" y="200">SDA</text><text x="465" y="200">SCL</text><text x="530" y="200">GND</text><rect x="700" y="75" width="220" height="120" fill="#fcebdc" stroke="#162d3a"/><text x="715" y="100">Relay contacts</text><text x="705" y="145">COM</text><text x="875" y="145">NO</text><text x="715" y="180">NC unused</text><rect x="1035" y="80" width="140" height="110" fill="#fff4bc" stroke="#162d3a"/><text x="1045" y="110">5 V lamp</text><text x="1045" y="140">+ 40 mA</text><text x="1045" y="175">−</text><rect x="75" y="355" width="220" height="140" fill="#e3f1f9" stroke="#162d3a"/><text x="95" y="385">HC-SR501 PIR</text><text x="95" y="425">VCC 5 V</text><text x="220" y="425">OUT</text><text x="95" y="470">GND</text><rect x="435" y="330" width="290" height="250" fill="#e3f1f9" stroke="#162d3a"/><text x="455" y="360">Arduino Nano 33 IoT</text><text x="445" y="405">D2</text><text x="660" y="405">D5</text><text x="455" y="455">3V3</text><text x="515" y="455">A4</text><text x="570" y="455">A5</text><text x="650" y="455">GND</text><text x="455" y="540">Independent USB power</text><rect x="880" y="355" width="290" height="150" fill="#fcebdc" stroke="#162d3a"/><text x="895" y="385">3.3 V-compatible relay module</text><text x="890" y="425">IN</text><text x="975" y="425">VCC 5 V</text><text x="1100" y="465">GND</text><text x="745" y="530">10 kΩ pulldown</text><text x="35" y="730">Common ground includes Nano, supply negative, PIR, INA219, relay coil and lamp negative.</text><text x="35" y="770">INA219 measures lamp branch only. Keep external positive off Nano 3V3 and USB positive.</text></g><g fill="none" stroke="#bf5d20" stroke-width="3"><path d="M 185 130 H 325 M 585 130 H 700 M 920 130 H 1035"/><path d="M 300 130 V 285 H 1010 V 355 M 135 285 V 355"/><rect x="245" y="118" width="45" height="24"/><path d="M 385 130 H 430"/><rect x="430" y="118" width="45" height="24"/><path d="M 475 130 H 520 M 760 130 L 850 110 M 860 130 H 875"/></g><g fill="none" stroke="#176787" stroke-width="3"><path d="M 295 420 H 360 V 400 H 435 M 725 400 H 805 V 420 H 880"/><path d="M 805 420 V 545"/><rect x="793" y="545" width="24" height="50"/><path d="M 805 595 V 675"/><path d="M 475 455 V 305 H 350 V 235 M 535 455 V 290 H 415 V 235 M 590 455 V 270 H 480 V 235"/><path d="M 185 165 H 205 V 675 H 1125 V 505 M 130 495 V 675 M 675 455 V 675 M 545 235 V 255 H 620 V 675 M 1090 190 V 675"/></g></svg>